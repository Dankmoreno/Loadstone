name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Loadstone se desarrolla en Windows, que es donde estan los juegos de
        # Paradox, pero el nucleo no depende del sistema y las rutas se
        # resuelven con platformdirs. Probar en los tres evita que una ruta
        # escrita con barras invertidas se cuele sin que nadie lo note.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Bibliotecas que Qt necesita en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Estilo
        run: python -m ruff check .

      - name: Pruebas
        # Las pruebas de interfaz necesitan una plataforma sin pantalla; el
        # conftest la fija, y aqui se deja explicito para que se vea.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    name: Ejecutable de Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Compilar
        run: >
          python -m PyInstaller packaging/loadstone.spec
          --noconfirm --distpath dist --workpath build

      - name: Comprobar que el ejecutable arranca
        # Sin consola no hay salida que mirar: el codigo de salida es la unica
        # senal de que el paquete esta completo.
        run: dist/Loadstone/Loadstone.exe --selftest

      - name: Publicar el resultado
        uses: actions/upload-artifact@v4
        with:
          name: loadstone-windows
          path: dist/Loadstone/
          retention-days: 14
